name: Build Intermarket Strategist Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/native-app-entry-and-foundation-2026-11-11
    paths:
      - '.github/workflows/build-android-preview.yml'
      - 'mobile/**'

permissions:
  contents: write

concurrency:
  group: intermarket-strategist-android-preview
  cancel-in-progress: false

jobs:
  build-android:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Check Expo project configuration
        working-directory: mobile
        run: npx expo-doctor

      - name: Type-check native app
        working-directory: mobile
        run: npm run typecheck

      - name: Verify Expo build credentials are available
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::The EXPO_TOKEN repository secret is missing or unavailable to this workflow."
            exit 1
          fi

      - name: Create or link the Expo project
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest init --account giniusox --non-interactive --json

      - name: Save the EAS project ID and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/app.json mobile/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Link native app to Expo EAS project"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Build Android preview APK
        id: eas_build
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set +e
          npx eas-cli@latest build --platform android --profile preview --non-interactive --wait --verbose-logs --json > eas-build.json
          BUILD_EXIT=$?
          set -e
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::error::Expo Android build failed. Collecting build metadata and available diagnostic artifacts."
            BUILD_ID="$(node -e "try { const fs=require('fs'); const data=JSON.parse(fs.readFileSync('eas-build.json','utf8')); const build=Array.isArray(data)?data[0]:data; if (build && build.id) process.stdout.write(build.id); } catch {}")"
            if [ -n "$BUILD_ID" ]; then
              echo "Failed EAS build ID: $BUILD_ID"
              npx eas-cli@latest build:view "$BUILD_ID" --json > "$RUNNER_TEMP/eas-build-view.json" || true
              cat "$RUNNER_TEMP/eas-build-view.json" || true
              mkdir -p "$RUNNER_TEMP/eas-diagnostics"
              node -e "try { const b=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/eas-build-view.json','utf8')); for (const u of (b.logFiles||[])) console.log(u); } catch {}" > "$RUNNER_TEMP/eas-log-urls.txt"
              LOG_INDEX=0
              while IFS= read -r LOG_URL; do
                [ -n "$LOG_URL" ] || continue
                LOG_INDEX=$((LOG_INDEX+1))
                echo "===== Expo build log $LOG_INDEX ====="
                curl --fail --location --silent --show-error "$LOG_URL" -o "$RUNNER_TEMP/eas-diagnostics/build-log-$LOG_INDEX.txt" || true
                if [ -s "$RUNNER_TEMP/eas-diagnostics/build-log-$LOG_INDEX.txt" ]; then
                  LOG_FILE="$RUNNER_TEMP/eas-diagnostics/build-log-$LOG_INDEX.txt"
                  if unzip -t "$LOG_FILE" >/dev/null 2>&1; then
                    echo "Expo returned a ZIP archive; extracting readable build logs:"
                    unzip -l "$LOG_FILE"
                    unzip -oq "$LOG_FILE" -d "$RUNNER_TEMP/eas-diagnostics/extracted-$LOG_INDEX"
                    find "$RUNNER_TEMP/eas-diagnostics/extracted-$LOG_INDEX" -type f -maxdepth 5 -print
                    find "$RUNNER_TEMP/eas-diagnostics/extracted-$LOG_INDEX" -type f -maxdepth 5 -exec sh -c 'echo "===== $1 ====="; tail -n 400 "$1"' _ {} \\
                  else
                    cat "$LOG_FILE"
                  fi
                else
                  echo "Could not retrieve this Expo build log."
                fi
              done < "$RUNNER_TEMP/eas-log-urls.txt"
              echo "Available diagnostic files:"
              find "$RUNNER_TEMP/eas-diagnostics" -maxdepth 2 -type f -printf '%p (%s bytes)\\n' || true
            else
              echo "No build ID was recovered. Raw EAS CLI output follows:"
              cat "$GITHUB_WORKSPACE/mobile/eas-build.json" || true
            fi
            exit "$BUILD_EXIT"
          fi

      - name: Download the completed APK
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID=$(node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('eas-build.json','utf8')); const build=Array.isArray(data)?data[0]:data; if (!build || !build.id) { console.error('EAS build response did not contain a build ID'); process.exit(1); } process.stdout.write(build.id);")
          echo "Downloading completed EAS build: $BUILD_ID"
          npx eas-cli@latest build:download --build-id "$BUILD_ID"
          APK_PATH="$(find /tmp/runner/eas-cli-nodejs/eas-build-run-cache -maxdepth 1 -type f -name "*${BUILD_ID}.apk" -print -quit)"
          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "::error::The completed EAS APK was not found in the EAS download cache."
            find /tmp/runner/eas-cli-nodejs/eas-build-run-cache -maxdepth 1 -type f -print || true
            exit 1
          fi
          cp "$APK_PATH" "$GITHUB_WORKSPACE/intermarket-strategist-android.apk"
          ls -lh "$GITHUB_WORKSPACE/intermarket-strategist-android.apk"

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intermarket-strategist-android-apk
          path: intermarket-strategist-android.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish permanent preview download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-preview-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" intermarket-strategist-android.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Intermarket Strategist Android Preview ${GITHUB_RUN_NUMBER}" \
            --notes "Preview APK build from commit ${GITHUB_SHA}. This is a beta preview, not a Play Store release." \
            --prerelease
