name: Build Intermarket Strategist Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/native-app-entry-and-foundation-2026-11-11
    paths:
      - '.github/workflows/build-android-preview.yml'
      - 'mobile/**'

permissions:
  contents: write

concurrency:
  group: intermarket-strategist-android-preview
  cancel-in-progress: false

jobs:
  build-android:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Check Expo project configuration
        working-directory: mobile
        run: npx expo-doctor

      - name: Type-check native app
        working-directory: mobile
        run: npm run typecheck

      - name: Verify Expo build credentials are available
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::The EXPO_TOKEN repository secret is missing or unavailable to this workflow."
            exit 1
          fi

      - name: Create or link the Expo project
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest init --account giniusox --non-interactive --json

      - name: Save the EAS project ID and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/app.json mobile/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Link native app to Expo EAS project"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Build Android preview APK
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait --json > eas-build.json

      - name: Download the completed APK
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID=$(node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('eas-build.json','utf8')); const build=Array.isArray(data)?data[0]:data; if (!build || !build.id) { console.error('EAS build response did not contain a build ID'); process.exit(1); } process.stdout.write(build.id);")
          echo "Downloading completed EAS build: $BUILD_ID"
          npx eas-cli@latest build:download --build-id "$BUILD_ID" --platform android

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: intermarket-strategist-android-apk
          path: mobile/*.apk
          if-no-files-found: error
          retention-days: 14
