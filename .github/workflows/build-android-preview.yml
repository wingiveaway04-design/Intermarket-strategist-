name: Build AIS Android Production App Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - feature/native-app-entry-and-foundation-2026-11-11
    paths:
      - '.github/workflows/build-android-preview.yml'
      - 'mobile/**'

permissions:
  contents: write

concurrency:
  group: intermarket-strategist-android-preview
  cancel-in-progress: false

jobs:
  build-android:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Check Expo project configuration
        working-directory: mobile
        run: npx expo-doctor

      - name: Type-check native app
        working-directory: mobile
        run: npm run typecheck

      - name: Verify Expo build credentials are available
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::The EXPO_TOKEN repository secret is missing or unavailable to this workflow."
            exit 1
          fi

      - name: Create or link the Expo project
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli@latest init --account giniusox --non-interactive --json

      - name: Save the EAS project ID and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/app.json mobile/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Link native app to Expo EAS project"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Build AIS production Android App Bundle
        id: eas_build
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set +e
          npx eas-cli@latest build --platform android --profile production --non-interactive --wait --json 2>&1 | tee eas-build-output.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::error::Expo Android build failed. Full EAS CLI output follows."
            cat eas-build-output.log || true
            BUILD_ID="$(node -e "try { const fs=require('fs'); const raw=fs.readFileSync('eas-build-output.log','utf8'); const match=raw.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i); if(match) process.stdout.write(match[0]); else { const data=JSON.parse(raw); const build=Array.isArray(data)?data[0]:data; if(build&&build.id) process.stdout.write(build.id); } } catch {}")"
            if [ -n "$BUILD_ID" ]; then
              echo "Recovered EAS build ID: $BUILD_ID"
              npx eas-cli@latest build:view "$BUILD_ID" --json > "$RUNNER_TEMP/eas-build-view.json" 2>&1 || true
              cat "$RUNNER_TEMP/eas-build-view.json" || true
              mkdir -p "$RUNNER_TEMP/eas-diagnostics"
              node -e "try { const fs=require('fs'); const text=fs.readFileSync(process.env.RUNNER_TEMP+'/eas-build-view.json','utf8'); const start=text.indexOf('{'); if(start<0) throw new Error('No JSON object found in EAS build:view output'); const raw=JSON.parse(text.slice(start)); const b=Array.isArray(raw)?raw[0]:raw; for (const u of (b?.logFiles||[])) console.log(u); } catch (e) { console.error('Could not parse EAS build log metadata:',e.message); }" > "$RUNNER_TEMP/eas-log-urls.txt"
              echo "Expo log URL count: $(wc -l < "$RUNNER_TEMP/eas-log-urls.txt")"
              LOG_INDEX=0
              while IFS= read -r LOG_URL; do
                [ -n "$LOG_URL" ] || continue
                LOG_INDEX=$((LOG_INDEX+1))
                curl --fail --location --silent --show-error "$LOG_URL" -o "$RUNNER_TEMP/eas-diagnostics/build-log-$LOG_INDEX.txt" || true
                if [ -s "$RUNNER_TEMP/eas-diagnostics/build-log-$LOG_INDEX.txt" ]; then
                  LOG_FILE="$RUNNER_TEMP/eas-diagnostics/build-log-$LOG_INDEX.txt"
                  if unzip -t "$LOG_FILE" >/dev/null 2>&1; then
                    unzip -oq "$LOG_FILE" -d "$RUNNER_TEMP/eas-diagnostics/extracted-$LOG_INDEX"
                    find "$RUNNER_TEMP/eas-diagnostics/extracted-$LOG_INDEX" -maxdepth 5 -type f -exec sh -c 'echo "===== $1 ====="; tail -n 400 "$1"' _ {} \;
                  else
                    cat "$LOG_FILE"
                  fi
                fi
              done < "$RUNNER_TEMP/eas-log-urls.txt"
            else
              echo "No EAS build ID was present in the captured output."
            fi
            exit "$BUILD_EXIT"
          fi
          cp eas-build-output.log eas-build.json
      - name: Preserve Expo diagnostics on failure
        if: always()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/eas-diagnostics"
          if [ -f "$RUNNER_TEMP/eas-build-view.json" ]; then
            cp "$RUNNER_TEMP/eas-build-view.json" "$GITHUB_WORKSPACE/eas-diagnostics/" || true
          fi
          if [ -f "$RUNNER_TEMP/eas-log-urls.txt" ]; then
            cp "$RUNNER_TEMP/eas-log-urls.txt" "$GITHUB_WORKSPACE/eas-diagnostics/" || true
          fi
          if [ -d "$RUNNER_TEMP/eas-diagnostics" ]; then
            cp -R "$RUNNER_TEMP/eas-diagnostics/." "$GITHUB_WORKSPACE/eas-diagnostics/" || true
          fi
          if [ -f "$GITHUB_WORKSPACE/mobile/eas-build.json" ]; then
            cp "$GITHUB_WORKSPACE/mobile/eas-build.json" "$GITHUB_WORKSPACE/eas-diagnostics/" || true
          fi

      - name: Upload Expo diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: expo-android-diagnostics
          path: eas-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Download the completed production AAB
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BUILD_ID=$(node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('eas-build.json','utf8')); const build=Array.isArray(data)?data[0]:data; if (!build || !build.id) { console.error('EAS build response did not contain a build ID'); process.exit(1); } process.stdout.write(build.id);")
          echo "Downloading completed EAS build: $BUILD_ID"
          npx eas-cli@latest build:download --build-id "$BUILD_ID"
          AAB_PATH="$(find /tmp/runner/eas-cli-nodejs/eas-build-run-cache -maxdepth 1 -type f -name "*${BUILD_ID}.aab" -print -quit)"
          if [ -z "$AAB_PATH" ] || [ ! -s "$AAB_PATH" ]; then
            echo "::error::The completed production AAB was not found in the EAS download cache."
            find /tmp/runner/eas-cli-nodejs/eas-build-run-cache -maxdepth 1 -type f -print || true
            exit 1
          fi
          cp "$AAB_PATH" "$GITHUB_WORKSPACE/ais-android-production.aab"
          ls -lh "$GITHUB_WORKSPACE/ais-android-production.aab"

      - name: Upload AIS production AAB as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ais-android-production-aab
          path: ais-android-production.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish production build download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ais-android-production-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" ais-android-production.aab \
            --repo "$GITHUB_REPOSITORY" \
            --title "AIS Android Production Build ${GITHUB_RUN_NUMBER}" \
            --notes "Production Android App Bundle for Abdulkadir Intermarket Strategies. This AAB is intended for Google Play Console submission; it is not an APK for direct installation."
